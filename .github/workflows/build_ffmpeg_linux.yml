name: Build Audio-Only FFmpeg for Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm build-essential pkg-config libssl-dev cmake ninja-build \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone FFmpeg Source
        run: |
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg_src

      - name: Build FFmpeg for Linux (x86_64 & arm64)
        run: |
          mkdir -p dist_linux/x86_64 dist_linux/arm64 dist_linux/include

          build_linux_arch() {
            ARCH=$1           # x86_64, aarch64
            DIST_NAME=$2      # x86_64, arm64
            CROSS_PREFIX=$3   # "" or "aarch64-linux-gnu-"

            echo "=========================================================="
            echo " Building FFmpeg for Linux ($DIST_NAME)..."
            echo "=========================================================="

            BUILD_DIR="$(pwd)/build_linux_${DIST_NAME}"
            rm -rf "$BUILD_DIR"
            cp -a ffmpeg_src "$BUILD_DIR"
            cd "$BUILD_DIR"
            PREFIX="$(pwd)/install_out"

            EXTRA_OPTS=""
            if [ -n "$CROSS_PREFIX" ]; then
              EXTRA_OPTS="--enable-cross-compile --cross-prefix=$CROSS_PREFIX --arch=$ARCH --target-os=linux"
            fi

            ./configure \
              --prefix="$PREFIX" \
              $EXTRA_OPTS \
              --enable-shared \
              --enable-static \
              --disable-programs \
              --disable-doc \
              --disable-avdevice \
              --disable-swscale \
              --disable-avfilter \
              --disable-hwaccels \
              --disable-vulkan \
              --disable-everything \
              --enable-version3 \
              --enable-openssl \
              --enable-protocol=file,pipe,http,https,tcp,tls,crypto,data,cache,subfile,concat,hls \
              --enable-demuxer=aac,mp3,ogg,flac,wav,mov,matroska,hls,mpegts,concat \
              --enable-decoder=aac,aac_latm,mp3,mp3float,opus,vorbis,flac,alac,ac3,eac3 \
              --enable-parser=aac,mpegaudio,opus,vorbis,flac \
              --enable-swresample \
              --enable-small \
              --enable-pic \
              --extra-cflags="-O3 -fPIC"

            make -j$(nproc)
            make install

            # Strip debug symbols
            if [ -n "$CROSS_PREFIX" ]; then
              ${CROSS_PREFIX}strip -s "$PREFIX/lib/"*.so || true
            else
              strip -s "$PREFIX/lib/"*.so || true
            fi

            # Copy .so and .a files to dist
            mkdir -p "../dist_linux/${DIST_NAME}"
            cp -d "$PREFIX/lib/"libav*.so* "$PREFIX/lib/"libswresample.so* "../dist_linux/${DIST_NAME}/" 2>/dev/null || true
            cp "$PREFIX/lib/"*.a "../dist_linux/${DIST_NAME}/" 2>/dev/null || true

            if [ ! -d "../dist_linux/include" ] || [ ! -f "../dist_linux/include/libavformat/avformat.h" ]; then
              cp -r "$PREFIX/include" "../dist_linux/include"
            fi

            cd ..
          }

          # 1. Linux x86_64 (Standard PC/Server)
          build_linux_arch "x86_64" "x86_64" ""

          # 2. Linux ARM64 (Raspberry Pi 4/5, AArch64)
          build_linux_arch "aarch64" "arm64" "aarch64-linux-gnu-"

      - name: Package Linux Libraries
        run: |
          cd dist_linux
          zip -r ../ffmpeg-linux-audio-libs.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-audio-libs
          path: ffmpeg-linux-audio-libs.zip

      - name: Create GitHub Release (Optional if tag pushed)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ffmpeg-linux-audio-libs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
